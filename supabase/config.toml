project_id = "task-manager-review"

[api]
enabled = true
port = 61921
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 61922
shadow_port = 61920
major_version = 17

[db.seed]
enabled = false

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5180"
signing_keys_path = "./.temp/task3-signing-keys.json"
additional_redirect_urls = ["http://127.0.0.1:5180", "http://localhost:5180", "http://localhost:5173", "http://localhost:5173/#reset"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10

# Local integration tests only. Hosted environments should require confirmation.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[studio]
enabled = false
port = 61923

[inbucket]
enabled = true
port = 61924

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = true

[functions.api]
verify_jwt = false

[analytics]
enabled = false
port = 61927

[auth.oauth_server]
enabled = true
allow_dynamic_registration = true
authorization_url_path = "/oauth/consent"

[functions.mcp]
verify_jwt = false
